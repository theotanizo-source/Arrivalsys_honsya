<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel ビジュアル再現</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Meiryo', 'メイリオ', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    #upload-area {
      width: 100%;
      max-width: 600px;
      border: 2px dashed #4a90e2;
      border-radius: 12px;
      background: #fff;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin-bottom: 24px;
    }

    #upload-area.dragover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }

    #upload-area .icon { font-size: 48px; margin-bottom: 12px; }
    #upload-area p { color: #555; font-size: 15px; margin-bottom: 16px; }
    #upload-area .hint { font-size: 12px; color: #999; }

    #file-input { display: none; }

    .upload-btn {
      display: inline-block;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 28px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: #1a73e8; }

    #file-name { font-size: 13px; color: #333; margin-top: 12px; min-height: 20px; }

    #sheet-selector-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    #sheet-selector-wrap label { font-size: 14px; color: #333; }
    #sheet-selector {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    #error-msg {
      color: #d93025;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    #table-wrap {
      display: none;
      width: 100%;
      overflow-x: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 8px;
    }

    #excel-table {
      border-collapse: collapse;
      font-size: 12px;
      font-family: 'Meiryo', 'メイリオ', 'MS Gothic', sans-serif;
    }

    #excel-table td {
      padding: 2px 4px;
      min-width: 64px;
      height: 20px;
      vertical-align: middle;
      white-space: pre;
    }
  </style>
</head>
<body>

  <div id="upload-area">
    <div class="icon">📊</div>
    <p>Excelファイルをドラッグ＆ドロップ<br>または下のボタンから選択</p>
    <label for="file-input" class="upload-btn">ファイルを選択</label>
    <input type="file" id="file-input" accept=".xlsx,.xls,.xlsm,.xlsb">
    <div id="file-name"></div>
    <div class="hint">.xlsx / .xls / .xlsm 対応</div>
  </div>

  <div id="error-msg"></div>

  <div id="sheet-selector-wrap">
    <label for="sheet-selector">シート：</label>
    <select id="sheet-selector"></select>
  </div>

  <div id="table-wrap">
    <table id="excel-table"></table>
  </div>

<script>
  var uploadArea = document.getElementById('upload-area');
  var fileInput  = document.getElementById('file-input');
  var fileNameEl = document.getElementById('file-name');
  var sheetWrap  = document.getElementById('sheet-selector-wrap');
  var sheetSel   = document.getElementById('sheet-selector');
  var tableWrap  = document.getElementById('table-wrap');
  var table      = document.getElementById('excel-table');
  var errorMsg   = document.getElementById('error-msg');

  var sheetsData = null;

  uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('dragover'); });
  uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', function() {
    if (fileInput.files[0]) processFile(fileInput.files[0]);
  });

  sheetSel.addEventListener('change', function() { renderSheet(sheetSel.value); });

  function processFile(file) {
    hideError();
    fileNameEl.textContent = '読み込み中...';

    var formData = new FormData();
    formData.append('file', file);

    fetch('/upload', { method: 'POST', body: formData })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) throw new Error(data.error);

        sheetsData = data.sheets;
        fileNameEl.textContent = '📄 ' + file.name;

        sheetSel.innerHTML = '';
        data.sheetNames.forEach(function(name) {
          var opt = document.createElement('option');
          opt.value = opt.textContent = name;
          sheetSel.appendChild(opt);
        });
        sheetWrap.style.display = 'flex';

        var defaultSheet = data.sheetNames.indexOf('Sheet1') >= 0 ? 'Sheet1' : data.sheetNames[0];
        sheetSel.value = defaultSheet;
        renderSheet(defaultSheet);
      })
      .catch(function(err) {
        showError('読み込みに失敗しました: ' + err.message);
        fileNameEl.textContent = '';
      });
  }

  function renderSheet(sheetName) {
    var data = sheetsData[sheetName];
    if (!data) return;

    table.innerHTML = '';

    var rows       = data.rows;
    var colWidths  = data.colWidths;
    var rowHeights = data.rowHeights;
    var merges     = data.merges;
    var minC       = data.minC || 0;
    var minR       = data.minR || 0;

    var mergeMap = {};
    merges.forEach(function(m) {
      mergeMap[m.sr + ',' + m.sc] = { rowspan: m.er - m.sr + 1, colspan: m.ec - m.sc + 1 };
      for (var r = m.sr; r <= m.er; r++) {
        for (var c = m.sc; c <= m.ec; c++) {
          if (r !== m.sr || c !== m.sc) mergeMap[r + ',' + c] = null;
        }
      }
    });

    var frag = document.createDocumentFragment();

    rows.forEach(function(cells, ri) {
      var tr = document.createElement('tr');
      tr.style.height = (rowHeights[ri] || 20) + 'px';

      cells.forEach(function(cell, ci) {
        var absC = minC + ci;
        var absR = minR + ri;
        var key  = absR + ',' + absC;

        if (mergeMap[key] === null) return;

        var td = document.createElement('td');

        if (mergeMap[key]) {
          if (mergeMap[key].rowspan > 1) td.rowSpan = mergeMap[key].rowspan;
          if (mergeMap[key].colspan > 1) td.colSpan = mergeMap[key].colspan;
        }

        var w = colWidths[absC] || 64;
        td.style.minWidth = w + 'px';
        td.style.width    = w + 'px';
        td.textContent    = cell.v || '';

        applyStyle(td, cell.s);
        tr.appendChild(td);
      });

      frag.appendChild(tr);
    });

    table.appendChild(frag);
    tableWrap.style.display = 'block';
  }

  function applyStyle(td, s) {
    if (!s) return;

    if (s.font) {
      if (s.font.bold)      td.style.fontWeight    = 'bold';
      if (s.font.italic)    td.style.fontStyle     = 'italic';
      if (s.font.sz)        td.style.fontSize      = Math.round(s.font.sz * 1.33) + 'px';
      if (s.font.underline) td.style.textDecoration = 'underline';
      if (s.font.strike)    td.style.textDecoration = 'line-through';
      if (s.font.color && s.font.color.rgb)
        td.style.color = '#' + s.font.color.rgb.slice(-6);
      if (s.font.name) td.style.fontFamily = s.font.name + ', sans-serif';
    }

    if (s.fill && s.fill.fgColor && s.fill.fgColor.rgb) {
      var rgb = s.fill.fgColor.rgb.slice(-6);
      if (rgb !== 'FFFFFF' && rgb !== '000000')
        td.style.backgroundColor = '#' + rgb;
    }

    if (s.alignment) {
      var h = s.alignment.horizontal;
      if (h === 'center')     td.style.textAlign = 'center';
      else if (h === 'right') td.style.textAlign = 'right';
      else if (h === 'left')  td.style.textAlign = 'left';

      var v = s.alignment.vertical;
      if (v === 'center')      td.style.verticalAlign = 'middle';
      else if (v === 'top')    td.style.verticalAlign = 'top';
      else if (v === 'bottom') td.style.verticalAlign = 'bottom';

      if (s.alignment.wrapText) td.style.whiteSpace = 'pre-wrap';
    }

    if (s.border) {
      ['top','bottom','left','right'].forEach(function(side) {
        var b = s.border[side];
        if (b && b.style && b.style !== 'none') {
          var color = (b.color && b.color.rgb) ? '#' + b.color.rgb.slice(-6) : '#000000';
          var prop  = 'border' + side[0].toUpperCase() + side.slice(1);
          td.style[prop] = bWidth(b.style) + ' ' + bStyle(b.style) + ' ' + color;
        }
      });
    }
  }

  function bWidth(s) {
    if (s === 'medium' || s === 'mediumDashed' || s === 'mediumDashDot') return '2px';
    if (s === 'thick') return '3px';
    return '1px';
  }
  function bStyle(s) {
    if (s === 'double') return 'double';
    if (s === 'dashed' || s === 'mediumDashed' || s === 'dashDot' ||
        s === 'mediumDashDot' || s === 'dashDotDot' || s === 'slantDashDot') return 'dashed';
    if (s === 'dotted') return 'dotted';
    return 'solid';
  }

  function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }
  function hideError()    { errorMsg.style.display = 'none'; }
</script>
</body>
</html>
